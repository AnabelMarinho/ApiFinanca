spring.application.name=ApiFinanca

# Database configuration - Railway usa SPRING_DATASOURCE_* automaticamente
# IMPORTANTE: No Railway, configure SPRING_DATASOURCE_URL com a URL completa (jdbc:postgresql://...)
# Prioriza SPRING_DATASOURCE_URL, depois DATABASE_PUBLIC_URL, depois DATABASE_URL
# Para desenvolvimento local, defina essas ou use os valores abaixo
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/financas_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${DATABASE_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DATABASE_PASSWORD:12345678}}}

# Server port - Railway provides PORT environment variable
server.port=${PORT:8080}

# JPA configuration - Railway pode definir SPRING_JPA_HIBERNATE_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration - uses environment variables with fallback
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-secure-value}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# Springdoc OpenAPI configuration
springdoc.override-with-generic-response=false

